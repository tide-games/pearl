<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>og poster</title>
<style>body{margin:0;background:#444}canvas{display:block}</style></head>
<body>
<canvas id="og" width="1200" height="630"></canvas>
<script>
// 1200×630 OG poster for The Pearl — mid-fall, one bounce from fortune.
const cv=document.getElementById('og'),ctx=cv.getContext('2d');
const W=1200,H=630;
let g=ctx.createLinearGradient(0,0,0,H);
g.addColorStop(0,'#7db4c4');g.addColorStop(.55,'#4d8aa0');g.addColorStop(1,'#1d5d77');
ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// light shafts
ctx.save();ctx.globalAlpha=.09;ctx.fillStyle='#fff';
for(let i=0;i<4;i++){const x=200+i*280;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+80,0);ctx.lineTo(x-60,H);ctx.lineTo(x-140,H);ctx.closePath();ctx.fill();}
ctx.restore();
// kelp
ctx.lineCap='round';
[[70,4],[150,3],[1080,4],[1150,3]].forEach(([kx,fr],ki)=>{
  for(let f=0;f<fr;f++){ctx.strokeStyle=`rgba(46,110,90,${.4-f*.06})`;ctx.lineWidth=9-f;
    ctx.beginPath();const x0=kx+f*12-fr*5;ctx.moveTo(x0,H-30);
    for(let s=1;s<=6;s++){const yy=H-30-s*90;const sw=Math.sin(ki*2+f+s*.8)*(6+s*3);
      ctx.quadraticCurveTo(x0+sw*.6,yy+40,x0+sw,yy);}ctx.stroke();}
});
// the v2 board: rails, notches, peg grid, twin bumpers, the shell
const CX=640,TOP=150,GAP=44,PITCH=64,RAILX=CX-6.4*PITCH;
const px2=(p)=>CX+(p-6)*PITCH;
// header rail + notches
ctx.fillStyle='#173f52'; ctx.fillRect(RAILX-30,TOP-64,12.8*PITCH+60,10);
[2,4,6,8,10].forEach((d,i)=>{
  const x=px2(d), sel=d===6;
  ctx.fillStyle=sel?'rgba(255,240,200,.95)':'rgba(190,215,225,.9)';
  ctx.beginPath(); ctx.moveTo(x-18,TOP-56); ctx.lineTo(x+18,TOP-56); ctx.lineTo(x+10,TOP-34); ctx.lineTo(x-10,TOP-34); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=sel?'#c9a24b':'rgba(20,50,65,.7)'; ctx.lineWidth=sel?3:1.5; ctx.stroke();
});
// side rails with studs
for(const sx of [RAILX-34, CX+6.4*PITCH+4]){
  ctx.fillStyle='#173f52'; ctx.fillRect(sx,TOP-54,30,H-TOP-40);
  ctx.fillStyle='#3f7d95';
  for(let r=0;r<8;r++){ ctx.beginPath(); ctx.arc(sx+15,TOP+10+r*44,6,0,7); ctx.fill(); }
}
// peg grid
for(let r=1;r<=7;r++){
  const y=TOP+r*GAP-GAP/2, off=(r%2)?0.5:0;
  for(let c=0;c<13-((r%2)?1:0);c++){
    const x=px2(c+off-0);
    if(x<RAILX||x>CX+6.4*PITCH) continue;
    ctx.fillStyle=(r===3||r===6)?'#e4a77f':'#d98e75';
    ctx.beginPath(); ctx.arc(x,y,6,0,7); ctx.fill();
    ctx.strokeStyle='rgba(90,30,20,.45)'; ctx.lineWidth=1.2; ctx.stroke();
  }
}
// the shell (glowing) at row 3 centre
(function(){ const x=px2(6), y=TOP+3*GAP-GAP/2;
  const rg=ctx.createRadialGradient(x,y,4,x,y,52);
  rg.addColorStop(0,'rgba(255,230,150,.5)'); rg.addColorStop(1,'rgba(255,230,150,0)');
  ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(x,y,52,0,7); ctx.fill();
  ctx.fillStyle='#e8c886'; ctx.strokeStyle='#8a6508'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(x,y+4,24,18,0,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke();
  for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(x,y+4); ctx.lineTo(x+i*10,y-13); ctx.strokeStyle='rgba(138,101,8,.6)'; ctx.lineWidth=1.6; ctx.stroke(); }
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y-2,5,0,7); ctx.fill();
})();
// twin bumpers at row 6
for(const p of [3,9]){
  const x=px2(p), y=TOP+6*GAP-GAP/2;
  const rg=ctx.createRadialGradient(x,y,6,x,y,64);
  rg.addColorStop(0,'rgba(255,180,120,.4)'); rg.addColorStop(1,'rgba(255,180,120,0)');
  ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(x,y,64,0,7); ctx.fill();
  const bg2=ctx.createRadialGradient(x-6,y-7,3,x,y,32);
  bg2.addColorStop(0,'#ffcf9a'); bg2.addColorStop(0.6,'#e8935f'); bg2.addColorStop(1,'#b35a37');
  ctx.fillStyle=bg2; ctx.beginPath(); ctx.arc(x,y,32,0,7); ctx.fill();
  ctx.strokeStyle='#6d2e18'; ctx.lineWidth=3; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(x,y,25,0,7); ctx.stroke();
  ctx.fillStyle='#5c2412'; ctx.font='800 17px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('×.4',x,y+1); ctx.textBaseline='alphabetic';
}
// seabed + oysters
const sb=ctx.createLinearGradient(0,H-120,0,H);
sb.addColorStop(0,'rgba(232,215,175,0)');sb.addColorStop(.3,'#cdb98e');sb.addColorStop(1,'#b9a276');
ctx.fillStyle=sb;ctx.fillRect(0,H-120,W,120);
const mults=['×0.94','×0.9','×0.85','×0.9','×0.91'];
for(let k=0;k<9;k++){
  const x=CX+(k-4)*PITCH, hot=k===4;
  const lbl=mults[Math.abs(k-4)];
  ctx.fillStyle=hot?'#e8c886':'#d3c4a8';
  ctx.strokeStyle='rgba(60,45,25,.55)';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(x,H-64,34,22,0,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.beginPath();ctx.ellipse(x,H-68,24,12,0,Math.PI,0);ctx.closePath();ctx.fill();
  ctx.fillStyle=hot?'#8a6508':'#3d4c59';ctx.font='700 17px system-ui';ctx.textAlign='center';
  ctx.fillText(lbl, x, H-30);
}
// THE pearl — big, mid-bounce, with sparkle trail
(function(){
  const x=px2(7),y=TOP+4*GAP;
  ctx.fillStyle='rgba(255,255,255,.4)';
  [[18,-26,8],[34,-48,6],[46,-68,4]].forEach(([dx,dy,r])=>{ctx.globalAlpha=.4;ctx.beginPath();ctx.arc(x-dx,y+dy,r,0,7);ctx.fill();});
  ctx.globalAlpha=1;
  const pg=ctx.createRadialGradient(x-8,y-10,3,x,y,30);
  pg.addColorStop(0,'#fff');pg.addColorStop(.6,'#efe8f8');pg.addColorStop(1,'#c3b8dd');
  ctx.fillStyle=pg;ctx.beginPath();ctx.arc(x,y,28,0,7);ctx.fill();
  ctx.strokeStyle='rgba(60,50,80,.4)';ctx.lineWidth=2;ctx.stroke();
})();
// title panel
ctx.fillStyle='rgba(247,241,227,.96)';
ctx.strokeStyle='#d9cdb4';ctx.lineWidth=2;
ctx.beginPath();ctx.roundRect(56,64,470,168,18);ctx.fill();ctx.stroke();
ctx.fillStyle='#1e6f8e';ctx.fillRect(56,64,470,6);
ctx.fillStyle='#232e38';ctx.font='800 58px "Iowan Old Style",Palatino,Georgia,serif';
ctx.textAlign='left';ctx.fillText('THE PEARL',84,132);
ctx.fillStyle='#5c6a76';ctx.font='italic 25px Georgia,serif';
ctx.fillText('the tide drops the pearl',86,170);
ctx.fillStyle='#1e6f8e';ctx.font='600 17px system-ui';
ctx.fillText('five notches · buzzers, bumpers, the Pearl Run ×10 · zero secrets',86,202);
</script>
</body></html>
